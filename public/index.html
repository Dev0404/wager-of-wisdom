<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>The Wager of Wisdom</title>
<style>
  :root{
    --indigo:#1B2A4A; --indigo-deep:#101A30;
    --marigold:#E8A33D; --marigold-soft:#F4C87A;
    --maroon:#7A2E2E; --cream:#F3EAD8; --teal:#1F6F6F;
    --good:#3E7D5A; --bad:#A23B3B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:
      radial-gradient(circle at 15% 8%, rgba(232,163,61,0.16), transparent 45%),
      radial-gradient(circle at 85% 92%, rgba(31,111,111,0.18), transparent 45%),
      var(--indigo-deep);
    color:var(--cream);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    min-height:100%; display:flex; justify-content:center;
  }
  #app{ width:100%; max-width:480px; min-height:100vh; padding:28px 20px 40px; display:flex; flex-direction:column; }
  .eyebrow{ font-family:'Helvetica Neue',Arial,sans-serif; text-transform:uppercase; letter-spacing:0.22em; font-size:11px; color:var(--marigold-soft); margin:0 0 6px; }
  h1{ font-size:29px; margin:0 0 4px; line-height:1.15; font-weight:400; }
  h1 .accent{ color:var(--marigold); font-style:italic; }
  .sub{ font-family:'Helvetica Neue',Arial,sans-serif; color:#C9C2AE; font-size:13.5px; margin:0 0 24px; line-height:1.5; }
  .card{ background:rgba(243,234,216,0.05); border:1px solid rgba(232,163,61,0.28); border-radius:2px; padding:22px; position:relative; }
  .card::before{ content:""; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg, var(--maroon), var(--marigold), var(--teal)); }
  button,input{ font-family:'Helvetica Neue',Arial,sans-serif; }
  button{ cursor:pointer; border:none; }
  .btn-primary{ width:100%; background:var(--marigold); color:var(--indigo-deep); font-weight:700; font-size:15px; padding:15px 18px; border-radius:1px; }
  .btn-primary:disabled{ background:#5b5540; color:#8a856f; cursor:not-allowed; }
  .btn-secondary{ width:100%; background:transparent; color:var(--cream); border:1px solid rgba(243,234,216,0.35); font-size:14px; padding:13px 18px; border-radius:1px; margin-top:10px; }
  .btn-danger{ width:100%; background:transparent; color:#E39A9A; border:1px solid var(--bad); font-size:14px; padding:13px 18px; border-radius:1px; margin-top:10px; }
  .role-pick{ display:flex; flex-direction:column; gap:14px; margin-top:6px; }
  .role-card{ text-align:left; background:rgba(243,234,216,0.04); border:1px solid rgba(232,163,61,0.3); padding:20px; color:var(--cream); border-radius:2px; }
  .role-card .rt{ font-family:Georgia,serif; font-size:19px; margin-bottom:4px; color:var(--marigold-soft); }
  .role-card .rd{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:12.5px; color:#C9C2AE; line-height:1.5; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; font-family:'Helvetica Neue',Arial,sans-serif; margin-bottom:16px; }
  .roundno{ font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--marigold-soft); }
  .balance{ font-family:'Helvetica Neue',Arial,sans-serif; display:flex; align-items:baseline; justify-content:space-between; background:rgba(232,163,61,0.08); border:1px solid rgba(232,163,61,0.25); padding:12px 16px; border-radius:2px; margin-bottom:18px; }
  .balance .lbl{ font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--marigold-soft); }
  .balance .val{ font-size:24px; color:var(--cream); font-family:Georgia,serif; }
  .cat-grid{ display:flex; flex-direction:column; gap:10px; }
  .cat-btn{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-radius:2px; background:rgba(243,234,216,0.05); border:1px solid rgba(232,163,61,0.28); color:var(--cream); text-align:left; }
  .cat-btn .ct{ font-family:Georgia,serif; font-size:17px; }
  .cat-btn .cn{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:11px; color:var(--marigold-soft); letter-spacing:0.08em; }
  .cat-btn:disabled{ opacity:0.35; }
  .cat-btn.bonus{ border-color:var(--teal); background:rgba(31,111,111,0.14); }
  .tag{ display:inline-block; font-family:'Helvetica Neue',Arial,sans-serif; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--indigo-deep); background:var(--teal); padding:4px 9px; border-radius:1px; margin-bottom:14px; }
  .statement{ font-size:20px; line-height:1.4; margin:0 0 20px; }
  .answer-reveal{ margin-top:6px; padding:16px; border-radius:2px; background:rgba(62,125,90,0.18); border:1px solid var(--good); }
  .answer-word{ font-size:18px; margin:0 0 6px; color:#8FD6A8; }
  .answer-note{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:13px; color:#DCD5C2; line-height:1.5; }
  .opt-col{ display:flex; flex-direction:column; gap:9px; margin-bottom:20px; }
  .opt-btn{ display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:2px; text-align:left; background:rgba(243,234,216,0.05); border:1px solid rgba(243,234,216,0.22); color:var(--cream); font-size:14.5px; font-family:'Helvetica Neue',Arial,sans-serif; width:100%; }
  .opt-btn .letter{ width:24px; height:24px; min-width:24px; border-radius:50%; background:rgba(243,234,216,0.1); display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; color:var(--marigold-soft); }
  .opt-btn.sel{ background:var(--marigold); color:var(--indigo-deep); border-color:var(--marigold); }
  .opt-btn.sel .letter{ background:var(--indigo-deep); color:var(--marigold); }
  .opt-btn.correct{ background:rgba(62,125,90,0.28); border-color:var(--good); }
  .opt-btn.correct .letter{ background:var(--good); color:var(--cream); }
  .opt-btn.wrong-sel{ background:rgba(162,59,59,0.28); border-color:var(--bad); }
  .opt-btn.wrong-sel .letter{ background:var(--bad); color:var(--cream); }
  label.flabel{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:#C9C2AE; display:block; margin-bottom:8px; }
  .wagerwrap{ margin-bottom:18px; }
  .wagerval{ font-family:Georgia,serif; font-size:26px; color:var(--marigold); margin-top:6px; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:8px; border-radius:4px; background:linear-gradient(90deg, var(--maroon), var(--marigold)); margin-top:10px; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:22px; height:22px; border-radius:50%; background:var(--cream); border:3px solid var(--indigo-deep); cursor:pointer; }
  input[type=text]{ width:100%; background:rgba(243,234,216,0.06); border:1px solid rgba(243,234,216,0.25); color:var(--cream); padding:13px 14px; font-size:16px; border-radius:2px; font-family:Georgia,serif; margin-bottom:14px; }
  .cap-note{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:11.5px; color:#9a9480; margin-top:6px;}
  .finalscreen{ text-align:center; padding:30px 0; }
  .finalscreen .flame{ font-size:44px; margin-bottom:10px; }
  .hostnote{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:11.5px; color:#9a9480; margin-top:14px; padding-top:14px; border-top:1px dashed rgba(243,234,216,0.15); line-height:1.5; }
  .lb-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 4px; border-bottom:1px solid rgba(243,234,216,0.08); font-family:'Helvetica Neue',Arial,sans-serif; font-size:13.5px; }
  .lb-row .nm{ color:var(--cream); }
  .lb-row .pt{ color:var(--marigold-soft); font-family:Georgia,serif; font-size:16px; }
  .statuspill{ display:inline-block; font-family:'Helvetica Neue',Arial,sans-serif; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; padding:4px 10px; border-radius:10px; }
  .statuspill.open{ background:rgba(62,125,90,0.25); color:#8FD6A8; }
  .statuspill.closed{ background:rgba(162,59,59,0.25); color:#E39A9A; }
  .errmsg{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:13px; color:#E39A9A; margin-bottom:12px; }
  footer{ margin-top:auto; padding-top:26px; text-align:center; font-family:'Helvetica Neue',Arial,sans-serif; font-size:10.5px; color:#5f5a48; letter-spacing:0.08em; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const LETTERS = ["A","B","C","D"];
const API = "/api/state";
const POLL_MS = 2000;

let myId = null, myRole = null, myName = "";
let latestState = null;
let selected = null, hasAnswered = false, lastAnswerKey = null, wagerLocked = 0;
let pendingSelected = null, pendingWager = 0;
let view = "landing", joinError = "";
let pollTimer = null;

async function apiGet(){
  const res = await fetch(API);
  return res.json();
}
async function apiPost(action, payload){
  const res = await fetch(API, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({action, payload}) });
  return res.json();
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    try{
      const s = await apiGet();
      const roundKey = s.activeCategory + "_" + (s.question ? s.question.text : "");
      if(roundKey !== lastAnswerKey){ hasAnswered = false; selected = null; pendingSelected = null; pendingWager = 0; }
      latestState = s;
      render();
    }catch(e){ /* ignore transient network errors */ }
  }, POLL_MS);
}

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function render(){ const app=document.getElementById('app'); app.innerHTML=''; app.appendChild(views[view]()); }

const views = {
landing: function(){
  const w = el(`
    <div>
      <p class="eyebrow">Rotary Club · Intellectual Game</p>
      <h1>The Wager of <span class="accent">Wisdom</span></h1>
      <p class="sub">Live edition — already deployed and ready. Just open this page and play.</p>
      <div class="role-pick">
        <button class="role-card" id="hostBtn">
          <div class="rt">I'm Hosting</div>
          <div class="rd">Control categories, reveal answers, and open or close the room to new players.</div>
        </button>
        <button class="role-card" id="playBtn">
          <div class="rt">I'm Playing</div>
          <div class="rd">Join the game — your screen updates automatically as the host plays.</div>
        </button>
      </div>
      <footer>Requires internet · Nothing to set up today</footer>
    </div>
  `);
  w.querySelector('#hostBtn').onclick = async ()=>{ myRole="host"; view="hostRoom"; latestState = await apiGet(); startPolling(); render(); };
  w.querySelector('#playBtn').onclick = ()=>{ myRole="player"; view="joinSetup"; render(); };
  return w;
},

joinSetup: function(){
  const w = el(`
    <div>
      <p class="eyebrow">Player</p>
      <h1>Join the <span class="accent">Game</span></h1>
      <div id="errBox">${joinError? `<p class="errmsg">${joinError}</p>` : ''}</div>
      <label class="flabel">Your Name</label>
      <input type="text" id="nameIn" maxlength="24" placeholder="e.g. Priya">
      <button class="btn-primary" id="joinBtn">Join</button>
      <button class="btn-secondary" id="backBtn">Back</button>
    </div>
  `);
  w.querySelector('#backBtn').onclick = ()=>{ view="landing"; render(); };
  w.querySelector('#joinBtn').onclick = async ()=>{
    myName = w.querySelector('#nameIn').value.trim() || "Player";
    const res = await apiPost("join", { name: myName });
    if(res.error){ joinError = res.message || "Could not join."; render(); return; }
    myId = res.id;
    latestState = res.state;
    joinError = "";
    view = "playerRoom";
    startPolling();
    render();
  };
  return w;
},

hostRoom: function(){
  const s = latestState;
  if(!s) return el('<div class="sub">Loading…</div>');
  const isClosed = s.status === "closed";
  if(s.activeCategory){ return hostQuestionView(s); }

  const rows = s.categories.map(c=>`
    <button class="cat-btn" data-cat="${c.name}" ${c.left<=0?'disabled':''}>
      <span class="ct">${c.name}</span><span class="cn">${c.left<=0?'complete':c.left+' left'}</span>
    </button>`).join('');

  const w = el(`
    <div>
      <div class="topbar"><span class="roundno">Host Dashboard</span><span class="statuspill ${isClosed?'closed':'open'}">${isClosed?'Closed to new joins':'Open'}</span></div>
      <div class="card">
        <p class="flabel" style="margin-bottom:10px;">Players Joined (${s.players.length})</p>
        ${s.players.length? s.players.map(p=>`<div class="lb-row"><span class="nm">${p.name}</span><span class="pt">${p.balance}</span></div>`).join('') : '<p class="cap-note">No one has joined yet.</p>'}
      </div>
      <p class="flabel" style="margin:22px 0 10px;">Pick a Category to Play</p>
      <div class="cat-grid">
        ${rows}
        <button class="cat-btn bonus" id="bonusBtn" ${s.bonusUsed?'disabled':''}>
          <span class="ct">Bonus — Double or Nothing</span><span class="cn">${s.bonusUsed?'used':'1 left'}</span>
        </button>
      </div>
      ${!isClosed
        ? `<button class="btn-danger" id="closeBtn">Close Room (block new joins)</button>`
        : `<button class="btn-secondary" id="reopenBtn">Reopen Room</button>`}
      <button class="btn-secondary" id="resetBtn">Reset Game (new event)</button>
    </div>
  `);
  w.querySelectorAll('.cat-btn[data-cat]').forEach(b=>{
    b.onclick = async ()=>{ latestState = await apiPost("select_category", {category:b.dataset.cat}); render(); };
  });
  w.querySelector('#bonusBtn').onclick = async ()=>{ latestState = await apiPost("select_category", {category:"__BONUS__"}); render(); };
  if(!isClosed){ w.querySelector('#closeBtn').onclick = async ()=>{ latestState = await apiPost("close_room"); render(); }; }
  else { w.querySelector('#reopenBtn').onclick = async ()=>{ latestState = await apiPost("reopen_room"); render(); }; }
  w.querySelector('#resetBtn').onclick = async ()=>{
    if(confirm("Reset all scores and start fresh? This affects everyone currently connected.")){
      latestState = await apiPost("reset_game"); render();
    }
  };
  return w;
},

playerRoom: function(){
  const s = latestState;
  if(!s) return el('<div class="sub">Loading…</div>');
  const me = s.players.find(p=>p.id===myId) || {balance:100};

  if(!s.activeCategory){
    return el(`
      <div>
        <div class="topbar"><span class="roundno">${myName}</span><span class="statuspill ${s.status==='closed'?'closed':'open'}">${s.status==='closed'?'Locked':'Live'}</span></div>
        <div class="balance"><span class="lbl">Wisdom Points</span><span class="val">${me.balance}</span></div>
        <div class="card" style="text-align:center;">
          <p class="statement" style="font-size:17px;">Waiting for the host to start the next question…</p>
        </div>
      </div>
    `);
  }

  const q = s.question;
  const isBonus = s.activeCategory === "__BONUS__";

  if(s.revealed){
    return el(`
      <div>
        <div class="topbar"><span class="roundno">${s.activeCategory}</span></div>
        <div class="balance"><span class="lbl">Wisdom Points</span><span class="val">${me.balance}</span></div>
        <div class="card">
          <span class="tag">${s.activeCategory}</span>
          <p class="statement">${q.text}</p>
          <div class="opt-col">
            ${q.options.map((o,i)=>{
              let cls='';
              if(i===q.correct) cls='correct';
              else if(hasAnswered && i===selected && i!==q.correct) cls='wrong-sel';
              return `<div class="opt-btn ${cls}"><span class="letter">${LETTERS[i]}</span><span>${o}</span></div>`;
            }).join('')}
          </div>
          <p class="answer-note">${q.note||''}</p>
          ${!hasAnswered? `<p class="cap-note" style="margin-top:12px;">You didn't lock in an answer this round.</p>`:''}
        </div>
      </div>
    `);
  }

  if(hasAnswered){
    return el(`
      <div>
        <div class="topbar"><span class="roundno">${s.activeCategory}</span></div>
        <div class="balance"><span class="lbl">Wisdom Points</span><span class="val">${me.balance}</span></div>
        <div class="card" style="text-align:center;">
          <p class="statement" style="font-size:17px;">Locked in with a wager of ${wagerLocked}. Waiting for the host to reveal…</p>
        </div>
      </div>
    `);
  }

  const cap = isBonus ? me.balance : Math.max(1, Math.floor(me.balance*0.5));
  const clampedWager = Math.min(pendingWager, cap);
  const w = el(`
    <div>
      <div class="topbar"><span class="roundno">${s.activeCategory}</span></div>
      <div class="balance"><span class="lbl">Wisdom Points</span><span class="val">${me.balance}</span></div>
      <div class="card">
        <span class="tag">${s.activeCategory}</span>
        <p class="statement">${q.text}</p>
        <div class="opt-col" id="optCol">
          ${q.options.map((o,i)=>`<button class="opt-btn ${pendingSelected===i?'sel':''}" data-i="${i}"><span class="letter">${LETTERS[i]}</span><span>${o}</span></button>`).join('')}
        </div>
        <div class="wagerwrap">
          <label class="flabel">Wager (max ${cap})</label>
          <input type="range" id="wagerSlide" min="0" max="${cap}" value="${clampedWager}">
          <div class="wagerval" id="wagerDisplay">${clampedWager}</div>
          <p class="cap-note">${isBonus? "Bonus round: you may wager your entire balance." : "Capped at 50% of your balance to keep you in the game."}</p>
        </div>
        <button class="btn-primary" id="lockBtn" ${pendingSelected===null?'disabled':''}>Lock In</button>
      </div>
    </div>
  `);
  const optBtns = w.querySelectorAll('.opt-btn');
  optBtns.forEach(b=>{
    b.onclick=()=>{
      pendingSelected=parseInt(b.dataset.i,10);
      optBtns.forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      lockBtn.disabled=false;
    };
  });
  const slider=w.querySelector('#wagerSlide'), wagerDisplay=w.querySelector('#wagerDisplay');
  slider.oninput=()=>{ pendingWager = parseInt(slider.value,10); wagerDisplay.textContent=slider.value; };
  const lockBtn=w.querySelector('#lockBtn');
  lockBtn.onclick=async ()=>{
    const wager = pendingWager;
    const chosen = pendingSelected;
    await apiPost("submit_answer", { playerId: myId, selected: chosen, wager });
    selected = chosen; hasAnswered = true; wagerLocked = wager;
    pendingSelected = null; pendingWager = 0;
    lastAnswerKey = s.activeCategory + "_" + (s.question ? s.question.text : "");
    render();
  };
  return w;
}
};

function hostQuestionView(s){
  const q = s.question;
  const w = el(`
    <div>
      <div class="topbar"><span class="roundno">${s.activeCategory}</span></div>
      <div class="card">
        <span class="tag">${s.activeCategory}</span>
        <p class="statement">${q.text}</p>
        <div class="opt-col">
          ${q.options.map((o,i)=>`
            <div class="opt-btn ${s.revealed && i===q.correct?'correct':''}">
              <span class="letter">${LETTERS[i]}</span><span>${o}</span>
            </div>`).join('')}
        </div>
        ${!s.revealed ? `<button class="btn-primary" id="revealBtn">Reveal Answer to Everyone</button>` : `
          <div class="answer-reveal">
            <p class="answer-word">Correct: ${LETTERS[q.correct]} — ${q.options[q.correct]}</p>
            <p class="answer-note">${q.note||''}</p>
          </div>
          <button class="btn-primary" id="nextBtn" style="margin-top:14px;">Back to Categories</button>
        `}
      </div>
      <div class="card" style="margin-top:14px;">
        <p class="flabel" style="margin-bottom:10px;">Live Scores (${s.players.length} players)</p>
        ${s.players.length? s.players.map(p=>`<div class="lb-row"><span class="nm">${p.name}</span><span class="pt">${p.balance}</span></div>`).join('') : '<p class="cap-note">No one has joined yet.</p>'}
      </div>
      <div class="hostnote">This is live on every joined phone within a couple of seconds.</div>
    </div>
  `);
  if(!s.revealed){ w.querySelector('#revealBtn').onclick = async ()=>{ latestState = await apiPost("reveal"); render(); }; }
  else { w.querySelector('#nextBtn').onclick = async ()=>{ latestState = await apiPost("next"); render(); }; }
  return w;
}

render();
</script>
</body>
</html>
