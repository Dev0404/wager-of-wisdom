<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>The Wager of Wisdom</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101A30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wager Wisdom">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --indigo:#1B2A4A; --indigo-deep:#101A30;
    --marigold:#E8A33D; --marigold-soft:#F4C87A;
    --maroon:#7A2E2E; --cream:#F3EAD8; --teal:#1F6F6F;
    --good:#3E7D5A; --bad:#A23B3B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:
      radial-gradient(circle at 15% 8%, rgba(232,163,61,0.16), transparent 45%),
      radial-gradient(circle at 85% 92%, rgba(31,111,111,0.18), transparent 45%),
      var(--indigo-deep);
    color:var(--cream);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    min-height:100%; display:flex; justify-content:center;
  }
  #app{ width:100%; max-width:480px; min-height:100vh; padding:28px 20px 40px; display:flex; flex-direction:column; }
  .eyebrow{ font-family:'Helvetica Neue',Arial,sans-serif; text-transform:uppercase; letter-spacing:0.22em; font-size:11px; color:var(--marigold-soft); margin:0 0 6px; }
  h1{ font-size:29px; margin:0 0 4px; line-height:1.15; font-weight:400; }
  h1 .accent{ color:var(--marigold); font-style:italic; }
  .sub{ font-family:'Helvetica Neue',Arial,sans-serif; color:#C9C2AE; font-size:13.5px; margin:0 0 24px; line-height:1.5; }
  .card{ background:rgba(243,234,216,0.05); border:1px solid rgba(232,163,61,0.28); border-radius:2px; padding:22px; position:relative; }
  .card::before{ content:""; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg, var(--maroon), var(--marigold), var(--teal)); }
  button{ font-family:'Helvetica Neue',Arial,sans-serif; cursor:pointer; border:none; }
  .btn-primary{ width:100%; background:var(--marigold); color:var(--indigo-deep); font-weight:700; font-size:15px; padding:15px 18px; border-radius:1px; }
  .btn-primary:disabled{ background:#5b5540; color:#8a856f; cursor:not-allowed; }
  .btn-secondary{ width:100%; background:transparent; color:var(--cream); border:1px solid rgba(243,234,216,0.35); font-size:14px; padding:13px 18px; border-radius:1px; margin-top:10px; }
  .role-pick{ display:flex; flex-direction:column; gap:14px; margin-top:6px; }
  .role-card{ text-align:left; background:rgba(243,234,216,0.04); border:1px solid rgba(232,163,61,0.3); padding:20px; color:var(--cream); border-radius:2px; }
  .role-card .rt{ font-family:Georgia,serif; font-size:19px; margin-bottom:4px; color:var(--marigold-soft); }
  .role-card .rd{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:12.5px; color:#C9C2AE; line-height:1.5; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; font-family:'Helvetica Neue',Arial,sans-serif; margin-bottom:16px; }
  .roundno{ font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--marigold-soft); }
  .balance{ font-family:'Helvetica Neue',Arial,sans-serif; display:flex; align-items:baseline; justify-content:space-between; background:rgba(232,163,61,0.08); border:1px solid rgba(232,163,61,0.25); padding:12px 16px; border-radius:2px; margin-bottom:18px; }
  .balance .lbl{ font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--marigold-soft); }
  .balance .val{ font-size:24px; color:var(--cream); font-family:Georgia,serif; }
  .cat-grid{ display:flex; flex-direction:column; gap:10px; }
  .cat-btn{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-radius:2px; background:rgba(243,234,216,0.05); border:1px solid rgba(232,163,61,0.28); color:var(--cream); text-align:left; }
  .cat-btn .ct{ font-family:Georgia,serif; font-size:17px; }
  .cat-btn .cn{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:11px; color:var(--marigold-soft); letter-spacing:0.08em; }
  .cat-btn:disabled{ opacity:0.35; }
  .cat-btn.bonus{ border-color:var(--teal); background:rgba(31,111,111,0.14); }
  .tag{ display:inline-block; font-family:'Helvetica Neue',Arial,sans-serif; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--indigo-deep); background:var(--teal); padding:4px 9px; border-radius:1px; margin-bottom:14px; }
  .statement{ font-size:20px; line-height:1.4; margin:0 0 20px; }
  .timerwrap{ height:6px; background:rgba(243,234,216,0.12); border-radius:3px; overflow:hidden; margin-bottom:18px; }
  .timerfill{ height:100%; width:100%; background:linear-gradient(90deg, var(--maroon), var(--marigold)); transition:width 1s linear; }
  .timerlabel{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:12px; color:#C9C2AE; margin-bottom:16px; }
  .answer-reveal{ margin-top:6px; padding:16px; border-radius:2px; background:rgba(62,125,90,0.18); border:1px solid var(--good); }
  .answer-word{ font-size:18px; margin:0 0 6px; color:#8FD6A8; }
  .answer-note{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:13px; color:#DCD5C2; line-height:1.5; }
  .navrow{ display:flex; gap:10px; margin-top:20px; }
  .navrow .btn-secondary{ margin-top:0; }
  .opt-col{ display:flex; flex-direction:column; gap:9px; margin-bottom:20px; }
  .opt-btn{ display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:2px; text-align:left; background:rgba(243,234,216,0.05); border:1px solid rgba(243,234,216,0.22); color:var(--cream); font-size:14.5px; font-family:'Helvetica Neue',Arial,sans-serif; width:100%; }
  .opt-btn .letter{ width:24px; height:24px; min-width:24px; border-radius:50%; background:rgba(243,234,216,0.1); display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; color:var(--marigold-soft); }
  .opt-btn.sel{ background:var(--marigold); color:var(--indigo-deep); border-color:var(--marigold); }
  .opt-btn.sel .letter{ background:var(--indigo-deep); color:var(--marigold); }
  .opt-btn.correct{ background:rgba(62,125,90,0.28); border-color:var(--good); }
  .opt-btn.correct .letter{ background:var(--good); color:var(--cream); }
  .opt-btn.wrong-sel{ background:rgba(162,59,59,0.28); border-color:var(--bad); }
  .opt-btn.wrong-sel .letter{ background:var(--bad); color:var(--cream); }
  label.flabel{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:#C9C2AE; display:block; margin-bottom:8px; }
  .wagerwrap{ margin-bottom:18px; }
  .wagerval{ font-family:Georgia,serif; font-size:26px; color:var(--marigold); margin-top:6px; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:8px; border-radius:4px; background:linear-gradient(90deg, var(--maroon), var(--marigold)); margin-top:10px; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:22px; height:22px; border-radius:50%; background:var(--cream); border:3px solid var(--indigo-deep); cursor:pointer; }
  .cap-note{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:11.5px; color:#9a9480; margin-top:6px;}
  .resultbig{ text-align:center; padding:10px 0 4px; }
  .resultbig .amt{ font-size:44px; font-family:Georgia,serif; margin:8px 0; }
  .resultbig .amt.pos{ color:#8FD6A8; }
  .resultbig .amt.neg{ color:#E39A9A; }
  .finalscreen{ text-align:center; padding:30px 0; }
  .finalscreen .flame{ font-size:44px; margin-bottom:10px; }
  .finalscreen h2{ font-size:15px; letter-spacing:0.18em; text-transform:uppercase; color:var(--marigold-soft); font-family:'Helvetica Neue',Arial,sans-serif; margin-bottom:4px; }
  .finalscreen .bignum{ font-size:56px; font-family:Georgia,serif; color:var(--cream); margin:6px 0 4px; }
  .hostnote{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:11.5px; color:#9a9480; margin-top:14px; padding-top:14px; border-top:1px dashed rgba(243,234,216,0.15); line-height:1.5; }
  footer{ margin-top:auto; padding-top:26px; text-align:center; font-family:'Helvetica Neue',Arial,sans-serif; font-size:10.5px; color:#5f5a48; letter-spacing:0.08em; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const CATEGORIES = {
  "Sports": [
    {text:"Which two years did India win the ICC Cricket World Cup?",
     options:["1975 & 1979","1983 & 2011","1992 & 1996","2003 & 2007"], correct:1,
     note:"Kapil Dev's 1983 side and MS Dhoni's 2011 side both lifted the trophy."},
    {text:"In which format did Sachin Tendulkar first score a double century?",
     options:["T20 International","Test Match","One Day International","First-class cricket"], correct:2,
     note:"He achieved it in an ODI in 2010, against South Africa."},
    {text:"In which sport has India won the most Olympic gold medals overall?",
     options:["Wrestling","Shooting","Hockey","Badminton"], correct:2,
     note:"India has 8 Olympic golds in hockey — its most successful Olympic sport by far."},
    {text:"Neeraj Chopra won India's first Olympic gold in athletics — in which event and Games?",
     options:["100m, Tokyo 2020","Javelin throw, Tokyo 2020","Long jump, Beijing 2008","Javelin throw, Paris 2024"], correct:1,
     note:"His javelin throw at Tokyo 2020 made history as India's first athletics gold."}
  ],
  "Culture": [
    {text:"Who built the Taj Mahal?", options:["Akbar","Shah Jahan","Aurangzeb","Humayun"], correct:1,
     note:"Built as a mausoleum for his wife, Mumtaz Mahal."},
    {text:"Kathakali, the classical dance-drama form, originates from which state?",
     options:["Tamil Nadu","Karnataka","Kerala","Andhra Pradesh"], correct:2,
     note:"Kathakali is a classical art form native to Kerala."},
    {text:"How many languages are officially recognized in the Eighth Schedule of the Indian Constitution?",
     options:["18","22","25","29"], correct:1,
     note:"It began with 14 languages and has been expanded over time to 22."}
  ],
  "Current Affairs": [
    {text:"In which year did India hold the G20 presidency?", options:["2021","2022","2023","2024"], correct:2,
     note:"The New Delhi summit was held in September 2023."},
    {text:"Where did Chandrayaan-3 land on the Moon in 2023?",
     options:["North Pole","South Pole","Equatorial region","Far side (dark side)"], correct:1,
     note:"It landed near the south pole — a global first for any country."},
    {text:"When was India's new Parliament building inaugurated?", options:["2021","2022","2023","2024"], correct:2,
     note:"Inaugurated in May 2023."}
  ],
  "Bollywood & Arts": [
    {text:"Which song from the film RRR won the Academy Award for Best Original Song?",
     options:["Naatu Naatu","Jai Ho","Kesariya","Chaiyya Chaiyya"], correct:0,
     note:"\"Naatu Naatu\" won at the 95th Academy Awards in 2023."},
    {text:"Who directed the film \"Lagaan\"?",
     options:["Ashutosh Gowariker","Karan Johar","Sanjay Leela Bhansali","Rajkumar Hirani"], correct:0,
     note:"Lagaan (2001) was also nominated for the Academy Award for Best Foreign Language Film."},
    {text:"Which legendary Indian sitar maestro performed globally and passed away in 2012?",
     options:["Zakir Hussain","Ravi Shankar","Bismillah Khan","Hariprasad Chaurasia"], correct:1,
     note:"Pandit Ravi Shankar is credited with popularizing Indian classical music worldwide."},
    {text:"Satyajit Ray, the legendary Indian filmmaker, is best known for which trilogy?",
     options:["Apu Trilogy","Godfather Trilogy","Malgudi Trilogy","Ramayana Trilogy"], correct:0,
     note:"The Apu Trilogy remains one of the most acclaimed works in world cinema."}
  ],
  "Business & Economy": [
    {text:"Which Indian conglomerate has generally ranked as India's largest company by market capitalization in recent years?",
     options:["Tata Group","Reliance Industries","Adani Group","Infosys"], correct:1,
     note:"Reliance Industries, led by Mukesh Ambani — worth a quick check for the latest ranking before your event."},
    {text:"What does \"UPI\" stand for in India's digital payments system?",
     options:["Unified Payments Interface","Universal Public Investment","United Payment Index","Unique Personal Identifier"], correct:0,
     note:"UPI has become one of the world's largest real-time payment systems by volume."},
    {text:"Which Indian city is popularly known as the \"Silicon Valley of India\"?",
     options:["Hyderabad","Bengaluru","Pune","Chennai"], correct:1,
     note:"Bengaluru is home to a large share of India's IT and startup industry."},
    {text:"Who is considered the chief architect of India's 1991 economic liberalization reforms, as Finance Minister at the time?",
     options:["Manmohan Singh","P. Chidambaram","Arun Jaitley","Yashwant Sinha"], correct:0,
     note:"Manmohan Singh later went on to serve as Prime Minister from 2004–2014."}
  ],
  "Regional & Food": [
    {text:"Which Indian state is the largest producer of tea?", options:["Kerala","Assam","Tamil Nadu","West Bengal"], correct:1,
     note:"Assam is renowned for its strong, malty black tea."},
    {text:"Biryani is widely believed to have been shaped by which cuisine's influence?",
     options:["Persian/Mughal","Portuguese","French","Chinese"], correct:0,
     note:"Biryani's layered rice-and-meat technique traces back to Persian and Mughal culinary traditions."},
    {text:"Which festival is known as the \"Festival of Colors\"?", options:["Diwali","Holi","Navratri","Onam"], correct:1,
     note:"Holi celebrates the arrival of spring and the triumph of good over evil."},
    {text:"Dosa and idli are staple dishes most associated with which region of India?",
     options:["Punjab","South India","Rajasthan","North-East India"], correct:1,
     note:"Both are fermented rice-and-lentil dishes central to South Indian cuisine."}
  ]
};
const BONUS = {
  text:"As of India's most recent Olympic Games, how many total Olympic gold medals has India won in its Summer Olympics history?",
  options:["6 – 7","8 – 9","10 – 11","12 or more"], correct:2,
  note:"India's tally stands at 10 Olympic golds — worth a quick check before your event in case a newer Games has changed this."
};
const START_BALANCE = 100;
const ROUND_SECONDS = 15;
const LETTERS = ["A","B","C","D"];
const CAT_NAMES = Object.keys(CATEGORIES);

let state = {
  view:"landing", pointer:{}, bonusUsed:false,
  screen:"categories", // categories | question | result | final
  activeCat:null, activeQ:null,
  revealed:false, timerLeft:ROUND_SECONDS, timerActive:false, timerHandle:null,
  balance:START_BALANCE, roundsPlayed:0,
  pSelected:null, pWager:0, lastDelta:0, lastCorrect:null
};
CAT_NAMES.forEach(c=>state.pointer[c]=0);

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function render(){ const app=document.getElementById('app'); app.innerHTML=''; app.appendChild(views[state.view]()); }

const views = {

landing: function(){
  const w = el(`
    <div>
      <p class="eyebrow">Rotary Club · Intellectual Game</p>
      <h1>The Wager of <span class="accent">Wisdom</span></h1>
      <p class="sub">Six categories, real multiple-choice questions. The host calls a category aloud — everyone taps the same one on their own phone, so the room stays in step without needing a network.</p>
      <div class="role-pick">
        <button class="role-card" id="hostBtn">
          <div class="rt">I'm Hosting</div>
          <div class="rd">Pick a category to call out and display for the room, with a timer for pacing.</div>
        </button>
        <button class="role-card" id="playBtn">
          <div class="rt">I'm Playing</div>
          <div class="rd">Tap whichever category the host calls, answer, wager, and get graded instantly.</div>
        </button>
      </div>
      <footer>Fully offline · No connection needed</footer>
    </div>
  `);
  w.querySelector('#hostBtn').onclick = ()=>{ resetGame(); state.view='host'; render(); };
  w.querySelector('#playBtn').onclick = ()=>{ resetGame(); state.view='player'; render(); };
  return w;
},

host: function(){
  if(state.screen==='categories'){ return categoryScreen(true); }
  return questionScreen(true);
},

player: function(){
  if(state.screen==='final'){ return finalScreen(); }
  if(state.screen==='categories'){ return categoryScreen(false); }
  if(state.screen==='question'){ return questionScreen(false); }
  if(state.screen==='result'){ return resultScreen(); }
}

};

function categoryScreen(isHost){
  const rows = CAT_NAMES.map(c=>{
    const left = CATEGORIES[c].length - state.pointer[c];
    const done = left<=0;
    return `<button class="cat-btn" data-cat="${c}" ${done?'disabled':''}>
      <span class="ct">${c}</span><span class="cn">${done? 'complete' : left+' left'}</span>
    </button>`;
  }).join('');
  const bonusDone = state.bonusUsed;
  const w = el(`
    <div>
      <div class="topbar">
        <span class="roundno">${isHost? 'Host Display' : 'Choose a Category'}</span>
        <span class="roundno">Rounds Played: ${state.roundsPlayed}</span>
      </div>
      ${!isHost ? `<div class="balance"><span class="lbl">Wisdom Points</span><span class="val">${state.balance}</span></div>` : ''}
      <div class="cat-grid">
        ${rows}
        <button class="cat-btn bonus" id="bonusBtn" ${bonusDone?'disabled':''}>
          <span class="ct">Bonus — Double or Nothing</span><span class="cn">${bonusDone? 'used' : '1 left'}</span>
        </button>
      </div>
      ${!isHost ? `<button class="btn-secondary" id="finishBtn">Finish & See Final Score</button>` : ''}
      ${isHost ? `<div class="hostnote">Call a category out loud, then tap it here. Ask the room to tap the same category on their own phones — since everyone's device tracks its own progress through each category, tapping the same one always lands on the same question, keeping the room in sync without any connection.</div>` : ''}
    </div>
  `);
  w.querySelectorAll('.cat-btn[data-cat]').forEach(b=>{
    b.onclick = ()=>{ openCategory(b.dataset.cat); render(); };
  });
  w.querySelector('#bonusBtn').onclick = ()=>{ openBonus(); render(); };
  if(!isHost){ w.querySelector('#finishBtn').onclick = ()=>{ state.screen='final'; render(); }; }
  return w;
}

function openCategory(cat){
  const idx = state.pointer[cat];
  state.activeCat = cat;
  state.activeQ = CATEGORIES[cat][idx];
  state.screen='question';
  state.revealed=false;
  resetTimer();
  state.pSelected=null; state.pWager=0;
}
function openBonus(){
  state.activeCat = "Bonus — Double or Nothing";
  state.activeQ = BONUS;
  state.screen='question';
  state.revealed=false;
  resetTimer();
  state.pSelected=null; state.pWager=0;
}

function questionScreen(isHost){
  const r = state.activeQ;
  const isBonus = state.activeCat.startsWith("Bonus");
  if(isHost){
    const w = el(`
      <div>
        <div class="topbar"><span class="roundno">${state.activeCat}</span></div>
        <div class="card">
          <span class="tag">${state.activeCat}</span>
          <p class="statement">${r.text}</p>
          <div class="opt-col">
            ${r.options.map((o,i)=>`
              <div class="opt-btn ${state.revealed && i===r.correct?'correct':''}">
                <span class="letter">${LETTERS[i]}</span><span>${o}</span>
              </div>`).join('')}
          </div>
          ${!state.revealed ? `
            <div class="timerlabel">Answer window</div>
            <div class="timerwrap"><div class="timerfill" id="tfill" style="width:${(state.timerLeft/ROUND_SECONDS)*100}%"></div></div>
            <div class="navrow">
              <button class="btn-secondary" id="timerBtn">${state.timerActive?'Pause Timer':'Start 15s Timer'}</button>
              <button class="btn-primary" id="revealBtn" style="flex:1;">Reveal Answer</button>
            </div>
          ` : `
            <div class="answer-reveal">
              <p class="answer-word">Correct: ${LETTERS[r.correct]} — ${r.options[r.correct]}</p>
              <p class="answer-note">${r.note||''}</p>
            </div>
          `}
        </div>
        <button class="btn-secondary" id="backBtn">Back to Categories</button>
        <div class="hostnote">Every player's device already has this question and grades itself the moment they lock in a wager.</div>
      </div>
    `);
    if(!state.revealed){
      w.querySelector('#timerBtn').onclick = toggleTimer;
      w.querySelector('#revealBtn').onclick = ()=>{ stopTimer(); state.revealed=true; if(!isBonus){ state.pointer[state.activeCat]++; } else { state.bonusUsed=true; } render(); };
    } else {
      w.querySelector('#backBtn').onclick = ()=>{ state.screen='categories'; render(); };
    }
    if(state.revealed){ /* pointer already advanced on reveal */ }
    if(!state.revealed){
      const back = w.querySelector('#backBtn');
      back.onclick = ()=>{ state.screen='categories'; render(); };
    }
    return w;
  }

  // player question screen
  const cap = isBonus ? state.balance : Math.max(1, Math.floor(state.balance*0.5));
  const w = el(`
    <div>
      <div class="topbar"><span class="roundno">${state.activeCat}</span></div>
      <div class="balance"><span class="lbl">Wisdom Points</span><span class="val">${state.balance}</span></div>
      <div class="card">
        <span class="tag">${state.activeCat}</span>
        <p class="statement">${r.text}</p>
        <div class="opt-col" id="optCol">
          ${r.options.map((o,i)=>`<button class="opt-btn" data-i="${i}"><span class="letter">${LETTERS[i]}</span><span>${o}</span></button>`).join('')}
        </div>
        <div class="wagerwrap">
          <label class="flabel">Wager (max ${cap})</label>
          <input type="range" id="wagerSlide" min="0" max="${cap}" value="0">
          <div class="wagerval" id="wagerDisplay">0</div>
          <p class="cap-note">${isBonus? "Bonus round: you may wager your entire balance." : "Capped at 50% of your balance to keep you in the game."}</p>
        </div>
        <button class="btn-primary" id="lockBtn" disabled>Lock In & Grade</button>
      </div>
      <button class="btn-secondary" id="backBtn">Cancel — Back to Categories</button>
    </div>
  `);
  let chosen=null;
  const optBtns = w.querySelectorAll('.opt-btn');
  optBtns.forEach(b=>{
    b.onclick=()=>{ chosen=parseInt(b.dataset.i,10); optBtns.forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); lockBtn.disabled=false; };
  });
  const slider=w.querySelector('#wagerSlide'), wagerDisplay=w.querySelector('#wagerDisplay');
  slider.oninput=()=>{ wagerDisplay.textContent=slider.value; };
  const lockBtn=w.querySelector('#lockBtn');
  lockBtn.onclick=()=>{
    state.pSelected=chosen; state.pWager=parseInt(slider.value||0,10);
    if(!isBonus){ state.pointer[state.activeCat]++; } else { state.bonusUsed=true; }
    gradeRound(r, isBonus);
  };
  w.querySelector('#backBtn').onclick=()=>{ state.screen='categories'; render(); };
  return w;
}

function gradeRound(r, isBonus){
  const correct = state.pSelected===r.correct;
  const multiplier = isBonus?2:1;
  const delta = correct? state.pWager*multiplier : -state.pWager;
  state.balance = Math.max(0, state.balance+delta);
  state.lastDelta=delta; state.lastCorrect=correct;
  state.roundsPlayed++;
  state.screen='result';
  render();
}

function resultScreen(){
  const r = state.activeQ;
  const correct = state.lastCorrect;
  const isBonus = state.activeCat.startsWith("Bonus");
  const w = el(`
    <div>
      <div class="topbar"><span class="roundno">${state.activeCat}</span></div>
      <div class="card">
        <span class="tag">${state.activeCat}</span>
        <p class="statement">${r.text}</p>
        <div class="opt-col">
          ${r.options.map((o,i)=>{
            let cls='';
            if(i===r.correct) cls='correct';
            else if(i===state.pSelected && !correct) cls='wrong-sel';
            return `<div class="opt-btn ${cls}"><span class="letter">${LETTERS[i]}</span><span>${o}</span></div>`;
          }).join('')}
        </div>
        <p class="answer-note" style="margin-bottom:10px;">${r.note||''}</p>
        <div class="resultbig">
          <p class="cap-note">${correct? (isBonus?'Correct — double or nothing!':'Correct') : 'Incorrect'}</p>
          <p class="amt ${state.lastDelta>=0?'pos':'neg'}">${state.lastDelta>=0?'+':''}${state.lastDelta}</p>
          <div class="balance" style="margin-top:8px;"><span class="lbl">New Balance</span><span class="val">${state.balance}</span></div>
        </div>
        <button class="btn-primary" id="nextBtn" style="margin-top:18px;">Back to Categories</button>
      </div>
    </div>
  `);
  w.querySelector('#nextBtn').onclick=()=>{ state.screen='categories'; render(); };
  return w;
}

function finalScreen(){
  return el(`
    <div>
      <div class="finalscreen">
        <div class="flame">🪔</div>
        <h2>Final Wisdom Total</h2>
        <p class="bignum">${state.balance}</p>
        <p class="sub" style="text-align:center;">Compare totals across the room — highest score claims the title. Ties break with one final sudden-death question from the host.</p>
        <button class="btn-secondary" id="restartBtn">Play Again on This Device</button>
      </div>
    </div>
  `);
}

document.addEventListener('click', function(e){
  if(e.target && e.target.id==='restartBtn'){ resetGame(); state.view='player'; render(); }
});

function resetGame(){
  state.pointer={}; CAT_NAMES.forEach(c=>state.pointer[c]=0);
  state.bonusUsed=false; state.screen='categories';
  state.balance=START_BALANCE; state.roundsPlayed=0;
  state.pSelected=null; state.pWager=0;
  resetTimer();
}
function resetTimer(){ stopTimer(); state.timerLeft=ROUND_SECONDS; }
function toggleTimer(){
  if(state.timerActive){ stopTimer(); }
  else{
    state.timerActive=true;
    state.timerHandle=setInterval(()=>{
      state.timerLeft-=1;
      if(state.timerLeft<=0){ stopTimer(); state.timerLeft=0; }
      updateTimerUI();
    },1000);
  }
  render();
}
function stopTimer(){ if(state.timerHandle) clearInterval(state.timerHandle); state.timerHandle=null; state.timerActive=false; }
function updateTimerUI(){ const fill=document.getElementById('tfill'); if(fill){ fill.style.width=((state.timerLeft/ROUND_SECONDS)*100)+'%'; } }

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
